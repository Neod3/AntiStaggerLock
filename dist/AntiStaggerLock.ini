[AntiStagger]

# Enable or disable the anti-stagger system
EnableAntiStagger=true

# Cooldown time in seconds between PHYSICAL staggers (melee/projectile) (0.0 - 10.0)
# Default: 3.5 seconds
StaggerCooldownTime=3.5

# Cooldown time in seconds between MAGIC staggers (0.0 - 10.0)
# Default: 5.0 seconds
# Magic staggers ALWAYS respect cooldown regardless of magnitude
MagicStaggerCooldown=5.0

# Maximum stagger magnitude that will be blocked (0.0 - 1.0)
# Default: 0.85
# Physical attacks ABOVE this value always pass through (strong/power attacks)
# Physical attacks BELOW or EQUAL to this value respect the cooldown
# Magic staggers ignore this setting and always respect cooldown
MaxMagnitudeToBlock=0.85

# Apply anti-stagger to the player
ApplyToPlayer=true

# Apply anti-stagger to NPCs (humanoid characters with playable race flag)
ApplyToNPCs=true

# Apply anti-stagger to creatures (non-playable race flag)
ApplyToCreatures=true
